# Per-environment semantic-mode <-> HDBSCAN-cluster-id taxonomy.
# Environment: CARLA bridge scenario using the livox1 clustering model.
#
# Cluster ID mapping (raw livox1 HDBSCAN IDs → dgppo canonical IDs via _map_cluster_id):
#   [0, 1]              → canonical 0  (Open Space)
#   [2, 3, 10, 11]      → canonical 1  (Bridge Approach)
#   [5, 6, 7, 8, 9, 12] → canonical 2  (On Bridge)
#   [-1, 4]             → canonical 3  (Bridge Exit)
#
# Centroid positions (CARLA world frame) come from highlevel_plan.json.

environment: bridge1_carla
source: clustering/clustering/encoder_weights/livox1/cluster_id_to_label_livox1.json

grid_origin: [55.0, -140.0]
grid_scale: 47.0
startup_yaw_deg: 0.0
default_model_dir: "dgppo/logs/LidarTarget/dgppo/terrain_bent_bridge"

# Which policy type each model uses (key into dgppo_id_maps below)
model_types:
  "dgppo/logs/LidarTarget/dgppo/terrain_bent_bridge": bridge

# Raw HDBSCAN cluster ID → dgppo one-hot slot (0-3), per policy.
# bridge: 0=open_space, 1=approach_bridge, 2=on_bridge, 3=exit_bridge
dgppo_id_maps:
  bridge:
    0: 0
    1: 0
    2: 1
    3: 1
    10: 1
    11: 1
    5: 2
    6: 2
    7: 2
    8: 2
    9: 2
    12: 2
    -1: 3
    4: 3

modes:
  "Open Space":        [0, 1]
  "Bridge Approach":   [2, 3, 10, 11]
  "On Bridge":         [5, 6, 7, 8, 9, 12]
  "Bridge Exit":       [4, -1]

# Centroids keyed by raw canonical ID (first cluster ID per mode).
# Run tools/map_picker.py to set real CARLA world positions.
centroids:
  "0": [90.0, -140.0, 0.0]   # Open Space        (raw canonical 0)
  "2": [90.0, -150.0, 0.0]   # Bridge Approach   (raw canonical 2)
  "5": [90.0, -175.0, 0.0]   # On Bridge         (raw canonical 5)
  "4": [90.0, -200.0, 0.0]   # Bridge Exit       (raw canonical 4)

# Bearings in degrees relative to startup_yaw_deg.  Keys use raw canonical IDs.
# Run tools/map_picker.py to calibrate for your actual spawn position.
bearing_map:
  "0-2":  90.0   # Open Space → Bridge Approach
  "2-5":  90.0   # Bridge Approach → On Bridge
  "5-4":  90.0   # On Bridge → Bridge Exit
  "4-5": 270.0   # Bridge Exit → On Bridge (reverse)
  "4-0":   0.0   # Bridge Exit → Open Space
  "2-0":   0.0   # Bridge Approach → Open Space
